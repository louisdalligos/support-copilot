name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run by hand from the Actions tab; also runs the paid Claude eval

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Generated data is up to date
        run: python -m copilot.seed --check
      - name: Retrieval eval (keyword search)
        run: python -m copilot.rag.evaluate --min-hit5 0.85 --out reports/rag-bm25.json
      - name: Agent eval (oracle model, tests tools, rules and guards)
        run: python -m copilot.agent.evaluate --model oracle --split all --min-action 1.0 --out reports/agent-oracle.json
      - name: Agent safety eval (adversarial model)
        run: python -m copilot.agent.evaluate --model adversarial --split all --out reports/agent-adversarial.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evals
          path: reports/

  # The real agent with Claude. It costs money, so it runs only when started by hand
  # (Actions tab > ci > Run workflow) and only if the ANTHROPIC_API_KEY secret is set.
  agent-claude:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -e .
      - name: Agent eval (Claude, dev split, facts judged)
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m copilot.agent.evaluate --model claude --split dev --judge --out reports/agent-claude-dev.json
      - uses: actions/upload-artifact@v4
        if: env.ANTHROPIC_API_KEY != '' && always()
        with:
          name: agent-claude
          path: reports/

  # The full hybrid pipeline with open models from Hugging Face. Runs only when the
  # HF_TOKEN secret is set, because EmbeddingGemma is a gated model.
  rag-models:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        if: env.HF_TOKEN != ''
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/copilot/rag/models.py') }}
      - name: Install (CPU-only PyTorch)
        if: env.HF_TOKEN != ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[rag]"
      - name: Retrieval eval (hybrid + reranker)
        if: env.HF_TOKEN != ''
        run: python -m copilot.rag.evaluate --dense --rerank --min-hit5 0.95 --out reports/rag-hybrid.json
      - uses: actions/upload-artifact@v4
        if: env.HF_TOKEN != ''
        with:
          name: rag-hybrid
          path: reports/rag-hybrid.json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci-only
        run: docker compose config --quiet

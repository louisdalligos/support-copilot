# Production on one VM: the base stack (Postgres, Phoenix) plus the app, Caddy and backups.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Only Caddy is reachable from the internet (ports 80 and 443). It serves HTTPS with
# certificates from Let's Encrypt, signs people in, and forwards to the app and Phoenix.
# Postgres and Phoenix stay on 127.0.0.1 and the internal Docker network.
# See docs/deploy.md.

services:
  app:
    image: ${COPILOT_IMAGE:-ghcr.io/louisdalligos/support-copilot:latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      # Caddy sets this header to the signed-in user; the app records them as the reviewer.
      COPILOT_TRUSTED_USER_HEADER: X-Authenticated-User
      COPILOT_FORWARDED_ALLOW_IPS: "*"
      COPILOT_MODEL: ${COPILOT_MODEL:-claude}
    expose:
      - "8000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
      - phoenix
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env (see docs/deploy.md)}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # pg_dump of both databases on a schedule, kept for BACKUP_KEEP_DAYS days in ./backups.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-copilot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  caddy_data:
  caddy_config:

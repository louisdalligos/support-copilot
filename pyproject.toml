[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot"
version = "0.1.0"
description = "AI support copilot for a fictional online store: RAG, MCP servers, a LangGraph agent and evals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Louis" }]
# The MCP SDK is pinned to 1.x because langchain-mcp-adapters does not support 2.x yet.
dependencies = [
    "mcp>=1.24,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-anthropic>=1.7,<2",  # native structured output (output_config.format)
    # Approval app: durable runs in Postgres, and its web pages.
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "starlette>=0.46",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Tracing to Arize Phoenix over OpenTelemetry.
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "openinference-instrumentation-langchain>=0.1.30",
]

[project.scripts]
zendesk-mcp = "copilot.zendesk.__main__:main"
shopify-mcp = "copilot.shopify.__main__:main"
policies-mcp = "copilot.rag.__main__:main"
copilot-approvals = "copilot.approvals.__main__:main"

[project.optional-dependencies]
# Open models for dense search and reranking. On a machine without a GPU, install
# CPU-only PyTorch first: pip install torch --index-url https://download.pytorch.org/whl/cpu
rag = [
    "sentence-transformers>=5.1,<6",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long literal ticket texts and tables are clearer on one line

[tool.ruff.lint.isort]
known-first-party = ["copilot"]
